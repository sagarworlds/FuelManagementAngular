<div class="row">
  <form class="col-md-6" novalidate [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <h2>Sign in</h2>
    @if (errorMessage(); as message) {
      <div class="alert alert-danger" role="alert">{{message}}</div>
    }
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" class="form-control" formControlName="email" autocomplete="username" />
      @if (loginForm.controls.email.touched && loginForm.controls.email.invalid) {
        <small class="text-danger">Enter a valid email address.</small>
      }
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" class="form-control" formControlName="password" autocomplete="current-password" />
      @if (loginForm.controls.password.touched && loginForm.controls.password.invalid) {
        <small class="text-danger">Enter your password.</small>
      }
    </div>
    <div class="form-group">
      <button type="submit" class="btn btn-primary" [disabled]="submitting()">
        {{submitting() ? 'Signing in…' : 'Sign in'}}
      </button>
    </div>
  </form>
</div>
