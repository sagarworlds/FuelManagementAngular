@if (loadError) {
  <div class="alert alert-danger" role="alert">{{loadError}}</div>
}
<div class="row">
  <!-- <div class="col-md-6">
    <h1>{{selectedMonthResult.month}} {{this.selectedMonthResult.year}}</h1>
  </div> -->
  <div class="col-md-6">
    <form [formGroup]="fuelHomeForm">
      <div class="form-group row">
        <div class="col-xs-2">
          <select #monthSelect (change)="monthChange(monthSelect.value)" class="form-control" formControlName="Month">
            @for (month of months; track month.value) {
              <option [value]="month.value">{{month.name}} </option>
            }
          </select>
        </div>
        <div class="col-xs-2">

          <select #yearSelect (change)="yearChange(yearSelect.value)" class="form-control" formControlName="Year">
            @for (year of years; track year.value) {
              <option [value]="year.value">{{year.name}} </option>
            }
          </select>
        </div>
      </div>

    </form>
  </div>
</div>
<div class="row">
  <div class="col-md-12">
    <div class="row">
      <div class="col-md-3">
        <div class="circle"> {{selectedMonthResult.totalPrice| currency: 'INR':'symbol'}}</div>
      </div>
      <div class="col-md-3">
        <div class="circle"> {{selectedMonthResult.totalFuel}}ltr</div>
      </div>
      <div class="col-md-3">
        <div class="circle"> {{selectedMonthResult.previousAvg||0}}</div>
      </div>
      <div class="col-md-3">
        <div class="circle"> {{selectedMonthResult.travelledDistance}}km</div>
      </div>
      <!-- <div class="col-md-3">
          <h5>Expense</h5>
          {{selectedMonthResult.totalPrice| currency: 'INR':true}}
        </div>
        <div class="col-md-3">

        </div>
        <div class="col-md-3">
          <h5>Distance</h5>
          {{selectedMonthResult.travelledDistance}}
        </div> -->

  </div>
</div>
